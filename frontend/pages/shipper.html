<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreightBid — Shipper Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* ── Layout ─────────────────────────────────────────────── */
        .dashboard {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 20px;
            align-items: start;
            padding: 20px 24px;
            max-width: 1400px;
            margin: 0 auto;
        }
        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
            .detail-sticky { position: static !important; }
        }

        /* ── Left panel ─────────────────────────────────────────── */
        .left-panel { display: flex; flex-direction: column; gap: 16px; }

        /* ── Shipment cards ─────────────────────────────────────── */
        .shipment-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            cursor: pointer;
            transition: border-color 0.18s, background 0.18s, transform 0.15s;
            margin-bottom: 0;
        }
        .shipment-card:hover { border-color: rgba(245,158,11,0.4); transform: translateX(2px); }
        .shipment-card.selected {
            border-color: var(--accent);
            background: rgba(245,158,11,0.06);
            border-left: 3px solid var(--accent);
        }

        /* ── Status pill ────────────────────────────────────────── */
        .status-pill {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 0.68rem; font-family: var(--font-mono);
            font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
            padding: 2px 8px; border-radius: 20px;
        }
        .pill-open     { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .pill-assigned { background: rgba(59,130,246,0.15); color: #3b82f6; }
        .pill-transit  { background: rgba(251,146,60,0.15); color: #fb923c; }
        .pill-delivered{ background: rgba(16,185,129,0.15); color: #10b981; }

        /* ── Detail panel ───────────────────────────────────────── */
        .detail-sticky {
            position: sticky;
            top: 72px;
            max-height: calc(100vh - 90px);
            overflow-y: auto;
            scrollbar-width: thin;
        }
        .detail-sticky::-webkit-scrollbar { width: 4px; }
        .detail-sticky::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }

        .detail-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        /* ── Detail tabs ────────────────────────────────────────── */
        .detail-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
        }
        .detail-tab {
            flex: 1; padding: 11px 8px;
            text-align: center; cursor: pointer;
            font-size: 0.78rem; font-weight: 600;
            color: var(--muted); border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
            font-family: var(--font-cond); letter-spacing: 0.04em;
        }
        .detail-tab:hover { color: var(--text); }
        .detail-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-pane { display: none; padding: 18px; }
        .tab-pane.active { display: block; }

        /* ── Bid table ──────────────────────────────────────────── */
        .bid-table { width: 100%; border-collapse: collapse; }
        .bid-table th {
            text-align: left; padding: 10px 12px;
            font-size: 0.72rem; color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }
        .bid-table td {
            padding: 13px 12px;
            border-bottom: 1px solid rgba(148,163,184,0.06);
            vertical-align: middle;
        }
        .bid-table tr:hover td { background: rgba(255,255,255,0.02); }
        .bid-winner-row td { background: rgba(34,197,94,0.05); }
        .bid-winner-badge {
            font-size: 0.65rem; font-family: var(--font-mono);
            color: var(--green); background: rgba(34,197,94,0.15);
            padding: 2px 7px; border-radius: 4px; margin-left: 6px;
        }
        .lowest-bid td:first-child { border-left: 3px solid var(--blue); }
        .bid-amount {
            font-family: var(--font-mono); font-weight: 700;
            background: rgba(0,0,0,0.3); padding: 3px 8px;
            border-radius: 4px; border: 1px solid var(--border);
        }

        /* ── Misc ───────────────────────────────────────────────── */
        .panel-detail { display: none; }
        .panel-detail.visible { display: block; }
        .refresh-btn {
            font-family: var(--font-mono); font-size: 0.72rem;
            color: var(--muted); background: none; border: none;
            cursor: pointer; padding: 3px 7px; border-radius: 4px;
            transition: color 0.15s, background 0.15s;
        }
        .refresh-btn:hover { color: var(--accent); background: rgba(245,158,11,0.08); }

        /* ── Drawer overlay ─────────────────────────────────────── */
        .drawer-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 400;
            opacity: 0; pointer-events: none;
            transition: opacity 0.25s;
        }
        .drawer-overlay.open { opacity: 1; pointer-events: all; }

        .drawer {
            position: fixed; top: 0; right: 0; bottom: 0;
            width: min(560px, 100vw);
            background: var(--bg);
            border-left: 1px solid var(--border);
            z-index: 500;
            transform: translateX(100%);
            transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .drawer.open { transform: translateX(0); }

        .drawer-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
            flex-shrink: 0;
        }
        .drawer-body {
            flex: 1; overflow-y: auto; padding: 20px 24px;
            scrollbar-width: thin;
        }
        .drawer-body::-webkit-scrollbar { width: 4px; }
        .drawer-body::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }
        .drawer-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            background: rgba(0,0,0,0.15);
            flex-shrink: 0;
        }

        /* ── Stats bar ──────────────────────────────────────────── */
        .stats-bar {
            display: flex; gap: 12px; flex-wrap: wrap;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.15);
        }
        .stat-chip {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.82rem;
        }
        .stat-chip-num {
            font-family: var(--font-cond); font-weight: 700;
            font-size: 1rem; color: var(--accent);
        }
        .stat-chip-label { color: var(--muted); font-size: 0.75rem; }

        /* ── Section header ─────────────────────────────────────── */
        .section-hdr {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px;
        }
        .section-title {
            font-family: var(--font-cond); font-weight: 700;
            font-size: 0.82rem; text-transform: uppercase;
            letter-spacing: 0.07em; color: var(--muted);
        }

        /* ── Truck counter ──────────────────────────────────────── */
        .truck-counter {
            display: flex; align-items: center; gap: 10px;
        }
        .counter-btn {
            width: 30px; height: 30px; border-radius: 6px;
            border: 1px solid var(--border); background: var(--surface2);
            font-size: 1rem; cursor: pointer; color: var(--muted);
            display: flex; align-items: center; justify-content: center;
            transition: border-color 0.15s;
        }
        .counter-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
        .counter-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    </style>
</head>
<body>

<!-- ── Top Nav ──────────────────────────────────────────────── -->
<nav class="nav">
    <a class="nav-logo" href="/">Freight<span>Bid</span></a>
    <div class="nav-right">
        <span class="nav-user" id="nav-name">...</span>
        <span style="color:var(--border)">|</span>
        <span style="color:var(--accent);font-size:0.72rem;font-family:var(--font-mono);letter-spacing:0.08em;">SHIPPER</span>
        <button class="btn btn-primary btn-sm" onclick="openDrawer()" style="gap:6px;">
            + Post Load
        </button>
        <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<!-- ── Stats Bar ─────────────────────────────────────────────── -->
<div class="stats-bar">
    <div class="stat-chip">
        <span class="stat-chip-num" id="stat-open">—</span>
        <span class="stat-chip-label">Open</span>
    </div>
    <div class="stat-chip">
        <span class="stat-chip-num" id="stat-assigned">—</span>
        <span class="stat-chip-label">Assigned</span>
    </div>
    <div class="stat-chip">
        <span class="stat-chip-num" id="stat-transit">—</span>
        <span class="stat-chip-label">In Transit</span>
    </div>
    <div class="stat-chip">
        <span class="stat-chip-num" id="stat-delivered">—</span>
        <span class="stat-chip-label">Delivered</span>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;">
        <button class="refresh-btn" onclick="loadMyShipments()" style="font-size:0.8rem;">↻ Refresh</button>
    </div>
</div>

<!-- ── Main Dashboard ────────────────────────────────────────── -->
<div class="dashboard">

    <!-- LEFT: Shipments List -->
    <div class="left-panel">
        <div class="section-hdr">
            <span class="section-title">My Shipments</span>
        </div>
        <div id="my-shipments-list">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <!-- RIGHT: Detail Panel -->
    <div class="detail-sticky">
        <!-- Placeholder -->
        <div id="detail-placeholder" class="detail-card" style="padding:60px 24px;">
            <div class="empty-state">
                <div class="icon">📋</div>
                <p style="font-size:0.9rem;">Select a shipment to view details, bids and photos.</p>
                <button class="btn btn-primary" onclick="openDrawer()" style="margin-top:20px;">
                    + Post Your First Load
                </button>
            </div>
        </div>

        <!-- Detail Panel -->
        <div class="detail-card panel-detail" id="detail-panel">
            <!-- Header -->
            <div style="padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;">
                <div>
                    <div style="font-family:var(--font-cond);font-weight:700;font-size:1.1rem;margin-bottom:4px;" id="detail-title">—</div>
                    <div id="detail-status"></div>
                </div>
                <button onclick="closeDetail()" style="background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:2px 6px;">✕</button>
            </div>

            <!-- Meta strip -->
            <div id="detail-meta" class="meta-row" style="padding:12px 18px;border-bottom:1px solid var(--border);gap:16px;margin:0;"></div>

            <!-- Tabs -->
            <div class="detail-tabs">
                <div class="detail-tab active" onclick="switchDetailTab('route')" id="tab-route">📍 Route</div>
                <div class="detail-tab" onclick="switchDetailTab('bids')" id="tab-bids">🎯 Bids</div>
                <div class="detail-tab" onclick="switchDetailTab('photos')" id="tab-photos">📷 Photos</div>
            </div>

            <!-- Tab: Route -->
            <div class="tab-pane active" id="pane-route">
                <div id="detail-map" style="height:240px;width:100%;border-radius:8px;margin-bottom:14px;display:none;border:1px solid var(--border);"></div>
                <div id="detail-route"></div>
            </div>

            <!-- Tab: Bids -->
            <div class="tab-pane" id="pane-bids">
                <div id="bids-container"><div class="loading">Loading bids...</div></div>
                <div id="award-section" style="margin-top:14px;"></div>
            </div>

            <!-- Tab: Photos -->
            <div class="tab-pane" id="pane-photos">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                    <span style="font-size:0.78rem;color:var(--muted);">Delivery proof photos</span>
                    <div style="display:flex;gap:6px;align-items:center;">
                        <button class="refresh-btn" onclick="loadPodPhotos(currentShipmentId)">↻</button>
                        <button id="proof-request-btn" class="btn btn-outline btn-sm"
                                style="font-size:0.72rem;padding:4px 10px;"
                                onclick="doRequestProof(currentShipmentId)">
                            🔔 Request Proof
                        </button>
                    </div>
                </div>
                <div id="proof-request-status" style="margin-bottom:10px;"></div>
                <div id="pod-section" style="display:block;">
                    <div id="pod-photos-grid"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ── Post Load Drawer ───────────────────────────────────────── -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="post-drawer">
    <div class="drawer-header">
        <div style="font-family:var(--font-cond);font-weight:700;font-size:1.1rem;">Post a Load</div>
        <button onclick="closeDrawer()" style="background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;">✕</button>
    </div>
    <div class="drawer-body">
        <div id="post-alert"></div>

        <!-- Route section -->
        <div style="margin-bottom:18px;">
            <div class="section-title" style="margin-bottom:10px;">Define Route</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
                <div>
                    <label style="font-size:0.75rem;color:var(--muted);display:block;margin-bottom:4px;">Pickup</label>
                    <div style="display:flex;gap:4px;">
                        <input type="text" id="search-pickup" placeholder="Search pickup..." style="font-size:0.82rem;padding:8px 10px;"
                               onkeydown="if(event.key==='Enter'){event.preventDefault();searchAddress('pickup');}">
                        <button class="btn btn-outline btn-sm" onclick="searchAddress('pickup')" style="padding:6px 10px;flex-shrink:0;">🔍</button>
                    </div>
                </div>
                <div>
                    <label style="font-size:0.75rem;color:var(--muted);display:block;margin-bottom:4px;">Add Drop</label>
                    <div style="display:flex;gap:4px;">
                        <input type="text" id="search-drop" placeholder="Search drop..." style="font-size:0.82rem;padding:8px 10px;"
                               onkeydown="if(event.key==='Enter'){event.preventDefault();searchAddress('drop');}">
                        <button class="btn btn-outline btn-sm" onclick="searchAddress('drop')" style="padding:6px 10px;flex-shrink:0;">➕</button>
                    </div>
                </div>
            </div>
            <div id="map" style="height:260px;width:100%;border-radius:8px;border:1px solid var(--border);margin-bottom:8px;"></div>
            <div id="route-text" style="font-size:0.82rem;color:var(--muted);min-height:18px;">No points selected.</div>
            <button class="btn btn-outline btn-sm" onclick="clearMap()" style="margin-top:8px;font-size:0.75rem;">✕ Clear Map</button>
        </div>

        <hr class="divider" style="margin:16px 0;">

        <!-- Goods details -->
        <div class="section-title" style="margin-bottom:10px;">Cargo Details</div>
        <div class="form-group">
            <label>Goods Description</label>
            <input type="text" id="goods" placeholder="e.g. Electronics, packaged goods...">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="form-group" style="margin-bottom:0;">
                <label>Weight (kg)</label>
                <input type="number" id="weight" placeholder="2500" oninput="autoCalcTrucks()" min="1">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label>Vehicle Type</label>
                <select id="vehicle" onchange="autoCalcTrucks()">
                    <option>Truck</option>
                    <option>Mini Truck</option>
                    <option>Container</option>
                    <option>Tempo</option>
                    <option>Trailer</option>
                </select>
            </div>
        </div>

        <!-- Truck count -->
        <div class="form-group" id="truck-count-group" style="display:none;margin-top:14px;">
            <label>Number of Vehicles
                <span id="truck-count-hint" style="font-size:0.7rem;color:var(--muted);font-family:var(--font-mono);margin-left:6px;"></span>
            </label>
            <div class="truck-counter">
                <button type="button" class="counter-btn" id="truck-dec-btn" onclick="changeTruckCount(-1)">−</button>
                <input type="number" id="num_trucks" value="1" min="1"
                       style="width:64px;text-align:center;font-size:1rem;font-weight:700;"
                       oninput="validateTruckCount()">
                <button type="button" class="counter-btn" onclick="changeTruckCount(1)">+</button>
                <span id="truck-weight-per" style="font-size:0.8rem;color:var(--muted);"></span>
            </div>
        </div>

        <hr class="divider" style="margin:16px 0;">

        <!-- Schedule -->
        <div class="section-title" style="margin-bottom:10px;">Schedule</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="form-group" style="margin-bottom:0;">
                <label>Deadline (optional)</label>
                <input type="datetime-local" id="deadline" min="" max="">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label>Est. Time (hours)</label>
                <input type="number" id="est_time" placeholder="e.g. 5" min="0.1" step="0.1">
            </div>
        </div>
    </div>
    <div class="drawer-footer">
        <div style="display:flex;gap:10px;">
            <button class="btn btn-outline" onclick="closeDrawer()" style="flex:1;">Cancel</button>
            <button class="btn btn-primary" onclick="doPostShipment()" id="post-btn" style="flex:2;font-weight:700;">
                → Post Load
            </button>
        </div>
    </div>
</div>


<script src="/js/api.js?v=2"></script>
    <script>
        // Guard: only shippers allowed
        if (!isLoggedIn() || getRole() !== "shipper") {
            window.location.href = "/";
        }

        document.getElementById("nav-name").textContent = getName();

        // ── Drawer open/close ──────────────────────────────────────
        function openDrawer() {
            document.getElementById('post-drawer').classList.add('open');
            document.getElementById('drawer-overlay').classList.add('open');
            // Init map inside drawer after it's visible
            setTimeout(() => { if (!map) initMap(); else map.invalidateSize(); }, 50);
        }
        function closeDrawer() {
            document.getElementById('post-drawer').classList.remove('open');
            document.getElementById('drawer-overlay').classList.remove('open');
        }

        // ── Detail tab switching ───────────────────────────────────
        function switchDetailTab(tab) {
            ['route','bids','photos'].forEach(t => {
                document.getElementById('tab-' + t).classList.toggle('active', t === tab);
                document.getElementById('pane-' + t).classList.toggle('active', t === tab);
            });
            // Invalidate map size when route tab becomes visible
            if (tab === 'route' && detailMap) setTimeout(() => detailMap.invalidateSize(), 50);
        }

        // ── Close detail panel ─────────────────────────────────────
        function closeDetail() {
            document.getElementById('detail-placeholder').style.display = '';
            document.getElementById('detail-panel').classList.remove('visible');
            currentShipmentId = null;
            document.querySelectorAll('.shipment-card').forEach(c => c.classList.remove('selected'));
            stopTrackingPoll();
        }

        let currentShipmentId = null;
        let myShipments = [];

        // ── Map Setup ──────────────────────────────────────────────
        let map;
        let pickupPoint = null;
        let dropPoints  = [];
        let redIcon     = null;  // initialized inside initMap() after Leaflet is ready

        function initMap() {
            // Define icon here — L is guaranteed loaded at this point
            redIcon = L.icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25,41], iconAnchor: [12,41], popupAnchor: [1,-34], shadowSize: [41,41]
            });
            map = L.map('map').setView([20.5937, 78.9629], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            map.on('click', async function(e) {
                const address = await reverseGeocode(e.latlng.lat, e.latlng.lng);
                if (!pickupPoint) {
                    const marker = L.marker(e.latlng).addTo(map)
                        .bindPopup("Pickup: " + (address || "")).openPopup();
                    pickupPoint = { lat: e.latlng.lat, lng: e.latlng.lng, address: address || "Pickup Location", marker };
                } else {
                    const drop = { lat: e.latlng.lat, lng: e.latlng.lng, address: address || ("Drop " + (dropPoints.length + 1)) };
                    const marker = L.marker(e.latlng, { icon: redIcon }).addTo(map)
                        .bindPopup("Drop: " + drop.address).openPopup();
                    drop.marker = marker;
                    dropPoints.push(drop);
                }
                renderRouteList();
            });
        }

        function clearMap() {
            if (pickupPoint) map.removeLayer(pickupPoint.marker);
            dropPoints.forEach(d => map.removeLayer(d.marker));
            pickupPoint = null;
            dropPoints  = [];
            renderRouteList();
        }

        // Remove pickup point individually
        function removePickup() {
            if (pickupPoint) { map.removeLayer(pickupPoint.marker); pickupPoint = null; }
            renderRouteList();
        }

        // Remove a specific drop point by index
        function removeDrop(idx) {
            if (dropPoints[idx]) { map.removeLayer(dropPoints[idx].marker); dropPoints.splice(idx, 1); }
            renderRouteList();
        }

        // Haversine distance between two lat/lng points — returns km
        function haversine(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2)
                    + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180)
                    * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function fmtDist(km) {
            return km < 1 ? (km * 1000).toFixed(0) + ' m' : km.toFixed(1) + ' km';
        }

        // Render the route list with per-leg distances and total distance
        function renderRouteList() {
            const el = document.getElementById("route-text");
            if (!pickupPoint && dropPoints.length === 0) {
                el.innerHTML = '<span style="color:var(--muted);">No points selected. Search or click map for Pickup.</span>';
                return;
            }

            // Build ordered list of all points: pickup + drops
            const allPoints = pickupPoint
                ? [{ ...pickupPoint, label: 'PICKUP', color: 'var(--blue)', isPickup: true }]
                : [];
            dropPoints.forEach((d, i) => allPoints.push({ ...d, label: `STOP ${i+1}`, color: 'var(--accent)', isPickup: false, idx: i }));

            // Calculate leg distances
            let totalKm = 0;
            const legs = [];  // legs[i] = distance from allPoints[i-1] to allPoints[i]
            for (let i = 1; i < allPoints.length; i++) {
                const km = haversine(allPoints[i-1].lat, allPoints[i-1].lng, allPoints[i].lat, allPoints[i].lng);
                legs.push(km);
                totalKm += km;
            }

            let html = '<div style="display:flex;flex-direction:column;gap:0;margin-top:4px;">';

            allPoints.forEach((p, i) => {
                const removeBtn = p.isPickup
                    ? `<button onclick="removePickup()" title="Remove pickup" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0 4px;line-height:1;" onmouseover="this.style.color='red'" onmouseout="this.style.color='var(--muted)'">✕</button>`
                    : `<button onclick="removeDrop(${p.idx})" title="Remove stop" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0 4px;line-height:1;" onmouseover="this.style.color='red'" onmouseout="this.style.color='var(--muted)'">✕</button>`;

                html += `<div style="display:flex;align-items:center;justify-content:space-between;
                                     background:var(--surface2);border-radius:6px;padding:7px 10px;
                                     border-left:3px solid ${p.color};">
                    <span style="font-size:0.82rem;">
                        <span style="font-family:var(--font-mono);font-size:0.68rem;color:var(--muted);margin-right:6px;">${p.label}</span>
                        ${p.address}
                    </span>
                    ${removeBtn}
                </div>`;

                // Show leg distance arrow between stops
                if (i < allPoints.length - 1) {
                    html += `<div style="display:flex;align-items:center;gap:6px;padding:3px 14px;">
                        <div style="width:1px;height:16px;background:var(--border);margin-left:4px;"></div>
                        <span style="font-size:0.72rem;color:var(--muted);font-family:var(--font-mono);">
                            ↓ ${fmtDist(legs[i])}
                        </span>
                    </div>`;
                }
            });

            // Total distance summary
            if (allPoints.length >= 2) {
                html += `<div style="margin-top:8px;padding:7px 10px;background:rgba(245,158,11,0.08);
                                     border-radius:6px;border:1px solid rgba(245,158,11,0.2);
                                     display:flex;justify-content:space-between;align-items:center;">
                    <span style="font-size:0.78rem;color:var(--muted);">Total Route Distance</span>
                    <span style="font-size:0.9rem;font-weight:700;color:var(--accent);font-family:var(--font-mono);">
                        ${fmtDist(totalKm)}
                    </span>
                </div>`;
            }

            html += '</div>';
            el.innerHTML = html;
        }

        async function searchAddress(type) {
            const input = document.getElementById(`search-${type}`);
            const raw   = input.value.trim();
            if (!raw) return;

            // Clean the query for Nominatim:
            // - Remove PIN/ZIP codes (6-digit Indian or 5-digit US)
            // - Remove " - " separators common in Indian addresses
            // - Collapse extra spaces
            function cleanQuery(q) {
                return q
                    .replace(/[-–]\s*\d{5,6}\b/g, '')   // remove "- 500035" or "– 500035"
                    .replace(/\b\d{6}\b/g, '')            // remove standalone 6-digit PIN
                    .replace(/\b\d{5}\b/g, '')            // remove standalone 5-digit ZIP
                    .replace(/\s{2,}/g, ' ')
                    .replace(/,\s*,/g, ',')
                    .trim()
                    .replace(/,\s*$/, '');                // trailing comma
            }

            // If first attempt fails, progressively simplify:
            // e.g. "Lakshmi Nagar, Road No 3, Kothapet, Hyderabad"
            //   → "Kothapet, Hyderabad"
            //   → "Hyderabad"
            function simplifyQuery(q) {
                const parts = q.split(',').map(p => p.trim()).filter(Boolean);
                if (parts.length <= 1) return null;
                return parts.slice(1).join(', ');
            }

            async function trySearch(q) {
                const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=in&q=${encodeURIComponent(q)}`;
                const resp = await fetch(url);
                const data = await resp.json();
                return data && data.length > 0 ? data : null;
            }

            try {
                let query = cleanQuery(raw);
                let results = await trySearch(query);

                // Retry with simplified query if nothing found
                if (!results) {
                    let simplified = simplifyQuery(query);
                    while (simplified && !results) {
                        results = await trySearch(simplified);
                        simplified = simplifyQuery(simplified);
                    }
                }

                if (!results) {
                    alert(`Location not found: "${raw}"\n\nTip: Try a shorter address like "Kothapet, Hyderabad" or click directly on the map.`);
                    return;
                }

                const result  = results[0];
                const latlng  = { lat: parseFloat(result.lat), lng: parseFloat(result.lon) };
                // Use the original raw input as the display address (more readable than Nominatim's)
                const address = raw.replace(/\s*[-–]\s*\d{5,6}\b/g, '').trim();

                if (type === 'pickup') {
                    if (pickupPoint) map.removeLayer(pickupPoint.marker);
                    const marker = L.marker(latlng).addTo(map).bindPopup("Pickup: " + address).openPopup();
                    pickupPoint = { ...latlng, address, marker };
                    map.setView(latlng, 14);
                } else {
                    const marker = L.marker(latlng, { icon: redIcon }).addTo(map).bindPopup("Drop: " + address).openPopup();
                    dropPoints.push({ ...latlng, address, marker });
                    map.setView(latlng, 14);
                }
                renderRouteList();
                input.value = "";

            } catch (err) {
                console.error("Geocoding error", err);
                alert("Geocoding service unavailable. Please click directly on the map.");
            }
        }

        async function reverseGeocode(lat, lng) {
            try {
                const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                const data = await resp.json();
                if (data && data.display_name) {
                    return data.display_name.split(',')[0] + (data.display_name.split(',')[1] ? ', ' + data.display_name.split(',')[1] : '');
                }
            } catch (err) {
                console.error("Reverse geocoding error", err);
            }
            return null;
        }

        // ── Deadline date bounds: today → exactly 1 year from today ──
        (function setDeadlineBounds() {
            const now   = new Date();
            const oneYearLater = new Date(now);
            oneYearLater.setFullYear(oneYearLater.getFullYear() + 1);

            // datetime-local needs format: YYYY-MM-DDTHH:mm
            const fmt = d => d.toISOString().slice(0, 16);

            const input = document.getElementById("deadline");
            input.min = fmt(now);
            input.max = fmt(oneYearLater);
        })();

        // ── Truck count auto-calculation ───────────────────────────
        // Capacity per vehicle type in kg
        const VEHICLE_CAPACITY = {
            "Truck":      1000,
            "Mini Truck":  500,
            "Container":  5000,
            "Tempo":       300,
            "Trailer":   10000
        };

        let minTrucks = 1;  // minimum required — cannot go below this

        function autoCalcTrucks() {
            const weight  = parseFloat(document.getElementById("weight").value) || 0;
            const vehicle = document.getElementById("vehicle").value;
            const group   = document.getElementById("truck-count-group");

            if (weight <= 0) {
                group.style.display = "none";
                return;
            }

            group.style.display = "block";

            const capacity = VEHICLE_CAPACITY[vehicle] || 1000;
            const required = Math.ceil(weight / capacity);
            minTrucks = required;

            const current = parseInt(document.getElementById("num_trucks").value) || 0;
            // Only increase if current is below required minimum
            if (current < required) {
                document.getElementById("num_trucks").value = required;
            }

            updateTruckUI();
        }

        function changeTruckCount(delta) {
            const input   = document.getElementById("num_trucks");
            const current = parseInt(input.value) || minTrucks;
            const next    = current + delta;

            if (next < minTrucks) return;  // cannot go below minimum
            input.value = next;
            updateTruckUI();
        }

        function validateTruckCount() {
            const input   = document.getElementById("num_trucks");
            const current = parseInt(input.value) || 0;
            if (current < minTrucks) {
                input.value = minTrucks;
            }
            updateTruckUI();
        }

        function updateTruckUI() {
            const weight   = parseFloat(document.getElementById("weight").value) || 0;
            const vehicle  = document.getElementById("vehicle").value;
            const count    = parseInt(document.getElementById("num_trucks").value) || 1;
            const capacity = VEHICLE_CAPACITY[vehicle] || 1000;

            // Hint: "min 2 required"
            document.getElementById("truck-count-hint").textContent =
                `(min ${minTrucks} required for ${weight} kg)`;

            // Per-truck weight
            const perTruck = count > 0 ? Math.ceil(weight / count) : 0;
            document.getElementById("truck-weight-per").textContent =
                perTruck > 0 ? `≈ ${perTruck.toLocaleString()} kg per vehicle` : "";

            // Disable − button if at minimum
            const decBtn = document.getElementById("truck-dec-btn");
            decBtn.disabled = count <= minTrucks;
            decBtn.style.opacity = count <= minTrucks ? "0.35" : "1";
            decBtn.style.cursor  = count <= minTrucks ? "not-allowed" : "pointer";
        }

                            iconAnchor: [12, 41],

        async function pollDriverLocation(shipmentId) {
            if (trackingPollInterval) clearInterval(trackingPollInterval);
            
            const update = async () => {
                try {
                    const data = await getLatestLocation(shipmentId);
                    if (data && data.lat) {
                        const pos = [data.lat, data.lng];
                        if (!driverMarker) {
                            driverMarker = L.marker(pos, {
                                icon: L.icon({
                                    iconUrl: 'https://cdn-icons-png.flaticon.com/512/3063/3063822.png', // truck icon
                                    iconSize: [32, 32],
                                    iconAnchor: [16, 16]
                                })
                            }).addTo(detailMap).bindPopup("Driver is here");
                        } else {
                            driverMarker.setLatLng(pos);
                        }
                    }
                } catch (e) { console.error("Poll error", e); }
            };

            update();
            trackingPollInterval = setInterval(update, 10000);
        }

        function stopTrackingPoll() {
            if (trackingPollInterval) clearInterval(trackingPollInterval);

        // ── Render the stops list with ack state for shipper ───────
        function renderDetailRoute(s) {
            const dests = (s.destinations || []).slice().sort((a, b) => a.order_index - b.order_index);

            let stopsHtml = "";
            if (dests.length === 0) {
                stopsHtml = '<span style="color:var(--muted);font-size:0.85rem;">No destinations</span>';
            } else {
                dests.forEach((d, i) => {
                    const isDelivered = d.status === "delivered";
                    const isInTransit = s.status === "in_transit";

                    // Icon
                    let icon;
                    if (isDelivered) {
                        icon = "✅";
                    } else if (d.ack_status === "approved") {
                        icon = "✔️";
                    } else if (d.ack_status === "pending_approval") {
                        icon = "🔔";
                    } else {
                        icon = "⏳";
                    }

                    // Right side — what the shipper sees
                    let rightSide = "";

                    if (isDelivered) {
                        // Delivered — green tick
                        rightSide =
                            '<span style="font-size:0.72rem;color:var(--green);font-family:var(--font-mono);' +
                            'background:rgba(34,197,94,0.12);padding:2px 8px;border-radius:4px;">' +
                            '✅ Delivered</span>';

                    } else if (d.ack_status === "approved") {
                        // Already approved — driver is on the way to deliver
                        rightSide =
                            '<span style="font-size:0.72rem;color:var(--green);font-family:var(--font-mono);' +
                            'background:rgba(34,197,94,0.12);padding:2px 8px;border-radius:4px;">' +
                            '✔ Approved</span>';

                    } else if (isInTransit) {
                        // Pending stop during active trip — show Approve button always
                        // Badge changes based on whether driver sent ack or not
                        const driverBadge = d.ack_status === "pending_approval"
                            ? '<span style="font-size:0.7rem;color:#f59e0b;font-family:var(--font-mono);' +
                              'background:rgba(245,158,11,0.15);padding:2px 7px;border-radius:4px;margin-right:6px;">' +
                              '🔔 Driver Arrived</span>'
                            : '<span style="font-size:0.7rem;color:var(--muted);font-family:var(--font-mono);' +
                              'margin-right:6px;">pending</span>';

                        rightSide =
                            driverBadge +
                            '<button class="btn btn-primary btn-sm" ' +
                            'style="padding:4px 12px;font-size:0.75rem;font-weight:600;" ' +
                            'onclick="doApproveArrival(\'' + s.id + '\',\'' + d.id + '\')">' +
                            '✓ Approve' +
                            '</button>';

                    } else {
                        rightSide =
                            '<span style="font-size:0.72rem;color:var(--muted);">' + d.status + '</span>';
                    }

                    stopsHtml +=
                        '<div style="display:flex;justify-content:space-between;align-items:center;' +
                        'padding:10px 0;border-bottom:1px solid var(--border);">' +
                            '<span style="font-size:0.9rem;">' +
                                icon + ' <strong>Stop ' + (i + 1) + ':</strong> ' + d.address +
                            '</span>' +
                            '<span style="display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:12px;">' +
                                rightSide +
                            '</span>' +
                        '</div>';
                });
            }

            document.getElementById("detail-route").innerHTML =
                '<div style="margin-bottom:10px;">' +
                    '<span style="font-size:0.72rem;font-family:var(--font-mono);color:var(--muted);' +
                    'text-transform:uppercase;letter-spacing:0.06em;">Pickup</span><br>' +
                    '<span style="font-weight:700;font-size:0.95rem;">' + s.pickup_address + '</span>' +
                '</div>' +
                '<div style="border-left:2px solid var(--border);margin-left:8px;padding-left:14px;">' +
                    stopsHtml +
                '</div>';
        }

        // ── Load Bids for Selected Shipment ────────────────────────
        // Always fetches fresh shipment + bids from server — never uses stale cache
        async function loadBids(shipmentId) {
            const container = document.getElementById("bids-container");
            const awardSection = document.getElementById("award-section");
            container.innerHTML = `<div class="loading">Loading bids...</div>`;
            awardSection.innerHTML = "";

            try {
                // Fetch both in parallel for speed
                const [bids, sDetail] = await Promise.all([
                    getBids(shipmentId),
                    getShipment(shipmentId)
                ]);

                // Keep myShipments cache in sync so the list card shows correct bid count
                const idx = myShipments.findIndex(x => x.id === shipmentId);
                if (idx !== -1) {
                    myShipments[idx] = { ...myShipments[idx], ...sDetail };
                    // Update the bid count badge on the shipment card
                    const cardBidsEl = document.querySelector(`#card-${shipmentId} .meta-value.accent`);
                    if (cardBidsEl) cardBidsEl.textContent = bids.length;
                    // Update status badge on the card
                    document.getElementById("detail-status").innerHTML = statusBadge(sDetail.status);
                }
                // Always re-render the route stops so Approve button appears on auto-refresh
                renderDetailRoute(sDetail);

                if (!bids.length) {
                    container.innerHTML = `
                    <div class="empty-state" style="padding:30px 0">
                        <div class="icon">🎯</div>
                        <p>No bids yet. Drivers will place bids soon.</p>
                    </div>`;
                    // Still show award section state even with no bids
                    if (sDetail.status === "delivered") {
                        renderRatingSection(awardSection, shipmentId, sDetail);
                    }
                    return;
                }

                const isOpen = sDetail.status === "open";

                container.innerHTML = `
                <table class="bid-table">
                    <thead>
                        <tr>
                            <th>Driver</th>
                            <th>Rating</th>
                            <th>Amount</th>
                            <th>Time</th>
                            ${isOpen ? "<th>Action</th>" : ""}
                        </tr>
                    </thead>
                    <tbody>
                        ${bids.map((b, i) => `
                            <tr class="${b.is_winner ? "bid-winner-row" : i === 0 ? "lowest-bid" : ""}">
                                <td>
                                    <div style="font-weight:600">
                                        <a href="#" onclick="showDriverProfile('${b.driver_id}');return false;"
                                           style="color:var(--text);text-decoration:none;border-bottom:1px dashed var(--muted);">
                                            ${b.driver_name}
                                        </a>
                                    </div>
                                    ${b.driver_phone
                                        ? `<div style="font-size:0.78rem;color:var(--muted)">${b.driver_phone}</div>`
                                        : ""}
                                    ${b.is_winner
                                        ? `<span class="bid-winner-badge">✓ WINNER</span>`
                                        : ""}
                                </td>
                                <td>
                                    ${b.driver_avg_rating
                                        ? `<div style="white-space:nowrap;">
                                               ${renderStars(b.driver_avg_rating)}
                                           </div>
                                           <div style="font-size:0.72rem;color:var(--muted);font-family:var(--font-mono);">
                                               ${b.driver_avg_rating.toFixed(1)} · ${b.driver_rating_count} trip${b.driver_rating_count !== 1 ? 's' : ''}
                                           </div>`
                                        : `<span style="font-size:0.75rem;color:var(--muted);">No ratings yet</span>`
                                    }
                                </td>
                                <td><span class="bid-amount">${fmt(b.amount)}</span></td>
                                <td style="color:var(--muted);font-size:0.82rem">
                                    ${timeAgo(b.created_at)}
                                </td>
                                ${isOpen ? `
                                <td>
                                    <button class="btn btn-outline btn-sm"
                                            onclick="doAward('${shipmentId}','${b.bid_id}')">
                                        Award
                                    </button>
                                </td>` : ""}
                            </tr>
                        `).join("")}
                    </tbody>
                </table>`;

                if (isOpen) {
                    const lowest = bids[0];
                    awardSection.innerHTML = `
                    <div style="display:flex;gap:10px;align-items:center">
                        <button class="btn btn-primary"
                                onclick="doAward('${shipmentId}')">
                            ⚡ Auto-Award Lowest — ${fmt(lowest.amount)}
                        </button>
                        <span style="font-size:0.78rem;color:var(--muted)">
                            ${lowest.driver_name}
                        </span>
                    </div>`;
                } else if (sDetail.status === "delivered") {
                    renderRatingSection(awardSection, shipmentId, sDetail);
                }

            } catch (err) {
                container.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
            }
        }

        function renderRatingSection(awardSection, shipmentId, sDetail) {
            if (sDetail.shipper_rating) {
                awardSection.innerHTML = `
                <div class="alert alert-success" style="margin-top: 10px;">
                    <strong>Rating Given:</strong> ⭐ ${sDetail.shipper_rating}
                </div>`;
            } else {
                awardSection.innerHTML = `
                <div class="card" style="margin-top: 10px; padding: 16px;">
                    <div style="font-weight:600; margin-bottom:8px;">Rate the Driver</div>
                    <div style="display:flex; gap:10px; align-items:center;">
                        <select id="driver-rating-${shipmentId}" class="form-control" style="width: 100px;">
                            <option value="5">5 - Excellent</option>
                            <option value="4">4 - Good</option>
                            <option value="3">3 - Average</option>
                            <option value="2">2 - Poor</option>
                            <option value="1">1 - Terrible</option>
                        </select>
                        <button class="btn btn-primary btn-sm" onclick="submitRating('${shipmentId}')">Submit Rating</button>
                    </div>
                </div>`;
            }
        }

        // ── Approve Driver Arrival ─────────────────────────────────
        async function doApproveArrival(shipmentId, destId) {
            try {
                await approveArrival(shipmentId, destId);
                // Refresh the detail panel so the badge updates immediately
                await selectShipment(shipmentId);
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        // ── Award Shipment ─────────────────────────────────────────
        async function doAward(shipmentId, bidId = null) {
            if (!confirm("Award this shipment? This cannot be undone.")) return;
            try {
                const result = await awardShipment(shipmentId, bidId);
                alert(`✓ Awarded to ${result.awarded_to} for ${fmt(result.winning_amount)}`);
                await loadMyShipments();
                await selectShipment(shipmentId);
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        // ── Submit Rating ──────────────────────────────────────────
        async function submitRating(shipmentId) {
            const score = document.getElementById(`driver-rating-${shipmentId}`).value;
            try {
                await rateDriver(shipmentId, score);
                alert("Rating submitted successfully!");
                await selectShipment(shipmentId);
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        // ── Auto-refresh ───────────────────────────────────────────
        // Refresh shipment list every 15s; refresh open bid panel every 10s
        setInterval(() => {
            loadMyShipments();
        }, 15000);

        setInterval(() => {
            if (currentShipmentId) {
                loadBids(currentShipmentId);
            }
        }, 10000);

        // ── Star renderer ──────────────────────────────────────────
        function renderStars(avg) {
            const full  = Math.floor(avg);
            const half  = avg - full >= 0.5 ? 1 : 0;
            const empty = 5 - full - half;
            return '⭐'.repeat(full) + (half ? '✨' : '') + '☆'.repeat(empty);
        }

        // ── Driver Profile Modal ───────────────────────────────────
        async function showDriverProfile(driverId) {
            // Create or reuse modal
            let modal = document.getElementById("driver-profile-modal");
            if (!modal) {
                modal = document.createElement("div");
                modal.id = "driver-profile-modal";
                modal.style.cssText =
                    "position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;" +
                    "display:flex;align-items:center;justify-content:center;padding:24px;";
                modal.innerHTML =
                    '<div id="driver-profile-box" style="background:var(--surface);border:1px solid var(--border);' +
                    'border-radius:12px;padding:28px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;">' +
                    '<div class="loading">Loading driver profile...</div></div>';
                modal.addEventListener("click", e => {
                    if (e.target === modal) modal.remove();
                });
                document.body.appendChild(modal);
            }

            const box = document.getElementById("driver-profile-box");
            box.innerHTML = '<div class="loading">Loading driver profile...</div>';

            try {
                const p = await getDriverProfile(driverId);

                // Star breakdown bar
                const breakdownHtml = [5,4,3,2,1].map(star => {
                    const count = p.breakdown[String(star)] || 0;
                    const pct   = p.total_ratings > 0 ? Math.round((count / p.total_ratings) * 100) : 0;
                    return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:0.82rem;">
                        <span style="width:16px;text-align:right;color:var(--muted);">${star}</span>
                        <span style="color:#f59e0b;font-size:0.75rem;">⭐</span>
                        <div style="flex:1;background:var(--surface2);border-radius:4px;height:8px;overflow:hidden;">
                            <div style="width:${pct}%;background:#f59e0b;height:100%;border-radius:4px;"></div>
                        </div>
                        <span style="width:28px;color:var(--muted);font-family:var(--font-mono);font-size:0.72rem;">${count}</span>
                    </div>`;
                }).join("");

                // Rating history
                const historyHtml = p.history.length === 0
                    ? '<p style="color:var(--muted);font-size:0.85rem;">No ratings yet.</p>'
                    : p.history.map(r => `
                        <div style="padding:10px 0;border-bottom:1px solid var(--border);">
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                                <span style="font-size:0.85rem;font-weight:600;">${r.shipment_goods}</span>
                                <span style="color:#f59e0b;font-size:0.9rem;">${'⭐'.repeat(Math.round(r.score))} <strong>${r.score}</strong></span>
                            </div>
                            <div style="font-size:0.75rem;color:var(--muted);margin-top:2px;">
                                By ${r.shipper_name} · ${timeAgo(r.created_at)}
                            </div>
                        </div>`).join("");

                box.innerHTML = `
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;">
                        <div>
                            <div style="font-size:1.2rem;font-weight:700;">${p.driver_name}</div>
                            ${p.driver_phone ? `<div style="font-size:0.82rem;color:var(--muted);">${p.driver_phone}</div>` : ""}
                        </div>
                        <button onclick="document.getElementById('driver-profile-modal').remove()"
                                style="background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;">✕</button>
                    </div>

                    <div style="display:flex;gap:24px;margin-bottom:20px;">
                        <div style="text-align:center;">
                            <div style="font-size:2rem;font-weight:700;color:#f59e0b;">
                                ${p.avg_rating ? p.avg_rating.toFixed(1) : "—"}
                            </div>
                            <div style="font-size:0.75rem;color:var(--muted);">Avg Rating</div>
                        </div>
                        <div style="text-align:center;">
                            <div style="font-size:2rem;font-weight:700;">${p.total_ratings}</div>
                            <div style="font-size:0.75rem;color:var(--muted);">Ratings</div>
                        </div>
                        <div style="text-align:center;">
                            <div style="font-size:2rem;font-weight:700;">${p.completed_trips}</div>
                            <div style="font-size:0.75rem;color:var(--muted);">Trips Done</div>
                        </div>
                    </div>

                    <div style="margin-bottom:20px;">
                        <div style="font-size:0.75rem;font-family:var(--font-mono);color:var(--muted);
                                    text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">
                            Rating Breakdown
                        </div>
                        ${breakdownHtml}
                    </div>

                    <div>
                        <div style="font-size:0.75rem;font-family:var(--font-mono);color:var(--muted);
                                    text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">
                            Rating History
                        </div>
                        ${historyHtml}
                    </div>`;

            } catch (err) {
                box.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
            }
        }

        // Init — load shipments on page open
        loadMyShipments();

        // ── POD Photos ─────────────────────────────────────────────
        async function loadPodPhotos(shipmentId) {
            const grid = document.getElementById('pod-photos-grid');
            if (!grid) return;

            // Always remove stale action bar before re-rendering
            const oldBar = document.getElementById('driver-action-bar');
            if (oldBar) oldBar.remove();

            try {
                const photos = await getShipmentPhotos(shipmentId);
                if (!photos.length) {
                    grid.innerHTML = '<div style="color:var(--muted);font-size:0.82rem;padding:8px 0;">No delivery photos yet.</div>';
                    return;
                }

                // Get driver info for call/complaint
                const sDetail = await getShipment(shipmentId);
                const driver  = sDetail.assigned_driver || null;

                grid.innerHTML = `
                    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;">
                        ${photos.map(p => {
                            const ackColor = p.ack_status === 'approved' ? 'var(--green)'
                                           : p.ack_status === 'rejected' ? '#ef4444'
                                           : '#f59e0b';
                            const ackIcon  = p.ack_status === 'approved' ? '✅ Approved'
                                           : p.ack_status === 'rejected' ? '❌ Rejected'
                                           : '⏳ Pending Review';
                            const typeLabel = p.pod_type === 'proof_request'
                                ? '<span style="font-size:0.68rem;color:#f59e0b;font-family:var(--font-mono);background:rgba(245,158,11,0.15);padding:1px 6px;border-radius:4px;">🔔 Proof</span>'
                                : '<span style="font-size:0.68rem;color:var(--green);font-family:var(--font-mono);background:rgba(34,197,94,0.12);padding:1px 6px;border-radius:4px;">✅ Delivery</span>';

                            const dt      = new Date(p.uploaded_at);
                            const dateStr = dt.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
                            const timeStr = dt.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });

                            const ackButtons = p.ack_status === 'pending' ? `
                                <div style="display:flex;gap:4px;margin-top:8px;">
                                    <button onclick="doAckPhoto('${shipmentId}','${p.pod_id}','approved')"
                                            style="flex:1;background:rgba(34,197,94,0.15);color:var(--green);
                                                   border:1px solid var(--green);font-size:0.68rem;padding:3px 0;
                                                   border-radius:4px;cursor:pointer;">
                                        ✅ OK
                                    </button>
                                    <button onclick="showRejectModal('${shipmentId}','${p.pod_id}')"
                                            style="flex:1;background:rgba(239,68,68,0.1);color:#ef4444;
                                                   border:1px solid #ef4444;font-size:0.68rem;padding:3px 0;
                                                   border-radius:4px;cursor:pointer;">
                                        ❌ Issue
                                    </button>
                                </div>` : `
                                <div style="margin-top:5px;font-size:0.68rem;color:${ackColor};font-family:var(--font-mono);">
                                    ${ackIcon}
                                    ${p.ack_notes ? `<div style="color:var(--muted);margin-top:2px;font-size:0.65rem;">"${p.ack_notes.substring(0,40)}${p.ack_notes.length>40?'…':''}"</div>` : ''}
                                </div>`;

                            return `
                                <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden;
                                            border-top:3px solid ${ackColor};">
                                    <img src="${p.image_url}" alt="Delivery photo"
                                         onclick="openPhotoModal('${p.image_url}','${(p.dest_address||'Proof Photo').replace(/'/g,"\\'")}','${p.uploaded_at}')"
                                         style="width:100%;height:100px;object-fit:cover;display:block;cursor:pointer;">
                                    <div style="padding:7px 8px;">
                                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
                                            ${typeLabel}
                                            <span style="font-size:0.62rem;color:var(--muted);">${dateStr}</span>
                                        </div>
                                        <div style="font-size:0.68rem;color:var(--muted);">
                                            ${p.dest_address ? `📍 ${p.dest_address.substring(0,25)}${p.dest_address.length>25?'…':''}` : 'On-demand proof'}
                                        </div>
                                        ${ackButtons}
                                    </div>
                                </div>`;
                        }).join('')}
                    </div>`;

                // Driver call + complaint bar — always re-create fresh
                if (driver) {
                    const bar = document.createElement('div');
                    bar.id = 'driver-action-bar';
                    bar.style.cssText = `margin-top:12px;padding:10px 14px;background:var(--surface2);
                        border-radius:8px;border:1px solid var(--border);
                        display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;`;
                    bar.innerHTML = `
                        <div style="font-size:0.8rem;">
                            <strong>${driver.name}</strong>
                            ${driver.phone ? `<span style="color:var(--muted);margin-left:6px;">${driver.phone}</span>` : ''}
                        </div>
                        <div style="display:flex;gap:8px;">
                            ${driver.phone ? `
                            <a href="tel:${driver.phone}" class="btn btn-outline btn-sm"
                               style="font-size:0.75rem;text-decoration:none;">
                                📞 Call Driver
                            </a>` : ''}
                            <button onclick="showComplaintModal('${shipmentId}')"
                                    class="btn btn-sm"
                                    style="font-size:0.75rem;background:rgba(239,68,68,0.1);
                                           color:#ef4444;border:1px solid #ef4444;">
                                🚨 Raise Complaint
                            </button>
                        </div>`;
                    grid.after(bar);
                }

            } catch (e) {
                grid.innerHTML = '<div style="color:var(--muted);font-size:0.82rem;">Could not load photos.</div>';
            }
        }

        // ── Acknowledge photo ──────────────────────────────────────
        async function doAckPhoto(shipmentId, podId, action, notes = '') {
            try {
                await acknowledgePodPhoto(shipmentId, podId, action, notes);
                await loadPodPhotos(shipmentId);
                if (action === 'approved') {
                    showShipperToast('✅ Photo approved — goods confirmed!', 'success');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        // ── Reject modal — ask for reason + reupload request ──────
        function showRejectModal(shipmentId, podId) {
            const existing = document.getElementById('reject-modal');
            if (existing) existing.remove();

            const modal = document.createElement('div');
            modal.id = 'reject-modal';
            modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:2000;display:flex;align-items:center;justify-content:center;padding:24px;';
            modal.innerHTML = `
                <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;
                             padding:28px;max-width:420px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,0.4);">
                    <div style="font-size:1.1rem;font-weight:700;margin-bottom:6px;">❌ Report an Issue</div>
                    <div style="font-size:0.82rem;color:var(--muted);margin-bottom:18px;">
                        Describe what's wrong with this photo or the goods shown.
                        The driver will be asked to re-upload.
                    </div>
                    <div class="form-group">
                        <label style="font-size:0.8rem;">Reason <span style="color:#ef4444;">*</span></label>
                        <select id="reject-reason" style="width:100%;margin-bottom:10px;">
                            <option value="Photo unclear">Photo is unclear / blurry</option>
                            <option value="Wrong goods shown">Wrong goods shown</option>
                            <option value="Goods appear damaged">Goods appear damaged</option>
                            <option value="Quantity mismatch">Quantity mismatch</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="font-size:0.8rem;">Additional notes (optional)</label>
                        <textarea id="reject-notes" rows="3"
                            style="width:100%;resize:vertical;font-size:0.85rem;padding:8px;
                                   background:var(--surface2);border:1px solid var(--border);
                                   border-radius:6px;color:var(--text);box-sizing:border-box;"
                            placeholder="e.g. Box 3 is missing, photo is too dark..."></textarea>
                    </div>
                    <div style="display:flex;gap:10px;margin-top:16px;">
                        <button onclick="document.getElementById('reject-modal').remove()"
                                class="btn btn-outline" style="flex:1;">Cancel</button>
                        <button onclick="submitReject('${shipmentId}','${podId}')"
                                class="btn btn-sm" style="flex:2;background:#ef4444;color:#fff;
                                border:none;border-radius:6px;font-weight:700;cursor:pointer;">
                            ❌ Reject &amp; Ask Re-upload
                        </button>
                    </div>
                </div>`;
            modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
            document.body.appendChild(modal);
        }

        async function submitReject(shipmentId, podId) {
            const reason = document.getElementById('reject-reason').value;
            const notes  = document.getElementById('reject-notes').value.trim();
            const full   = notes ? `${reason} — ${notes}` : reason;
            document.getElementById('reject-modal').remove();
            await doAckPhoto(shipmentId, podId, 'rejected', full);
            showShipperToast('❌ Rejection sent — driver will be notified to re-upload.', 'error');
        }

        // ── Complaint modal ────────────────────────────────────────
        function showComplaintModal(shipmentId) {
            const existing = document.getElementById('complaint-modal');
            if (existing) existing.remove();

            const modal = document.createElement('div');
            modal.id = 'complaint-modal';
            modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:2000;display:flex;align-items:center;justify-content:center;padding:24px;';
            modal.innerHTML = `
                <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;
                             padding:28px;max-width:440px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,0.4);">
                    <div style="font-size:1.1rem;font-weight:700;margin-bottom:4px;">🚨 Raise Complaint</div>
                    <div style="font-size:0.82rem;color:var(--muted);margin-bottom:18px;">
                        This will be recorded against the driver's profile.
                    </div>
                    <div class="form-group">
                        <label style="font-size:0.8rem;">Complaint Type <span style="color:#ef4444;">*</span></label>
                        <select id="complaint-reason" style="width:100%;margin-bottom:10px;">
                            <option value="Goods damaged">Goods damaged in transit</option>
                            <option value="Goods missing">Goods missing / short delivery</option>
                            <option value="Fake photo uploaded">Fake or misleading photo uploaded</option>
                            <option value="Driver unresponsive">Driver not responding</option>
                            <option value="Route deviation">Driver deviated from route</option>
                            <option value="Unprofessional behaviour">Unprofessional behaviour</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="font-size:0.8rem;">Description (optional)</label>
                        <textarea id="complaint-desc" rows="4"
                            style="width:100%;resize:vertical;font-size:0.85rem;padding:8px;
                                   background:var(--surface2);border:1px solid var(--border);
                                   border-radius:6px;color:var(--text);box-sizing:border-box;"
                            placeholder="Describe the issue in detail..."></textarea>
                    </div>
                    <div style="display:flex;gap:10px;margin-top:16px;">
                        <button onclick="document.getElementById('complaint-modal').remove()"
                                class="btn btn-outline" style="flex:1;">Cancel</button>
                        <button onclick="submitComplaint('${shipmentId}')"
                                class="btn btn-sm" style="flex:2;background:#ef4444;color:#fff;
                                border:none;border-radius:6px;font-weight:700;cursor:pointer;">
                            🚨 Submit Complaint
                        </button>
                    </div>
                </div>`;
            modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
            document.body.appendChild(modal);
        }

        async function submitComplaint(shipmentId) {
            const reason = document.getElementById('complaint-reason').value;
            const desc   = document.getElementById('complaint-desc').value.trim();
            document.getElementById('complaint-modal').remove();
            try {
                await raiseComplaint(shipmentId, reason, desc);
                showShipperToast('🚨 Complaint submitted and recorded against driver.', 'error');
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        function showShipperToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
                background:${type === 'success' ? '#22c55e' : '#ef4444'};
                color:#fff;padding:12px 24px;border-radius:8px;font-weight:600;
                font-size:0.88rem;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.3);`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function openPhotoModal(url, label, uploadedAt) {
            let modal = document.getElementById('photo-modal');
            if (modal) modal.remove();
            modal = document.createElement('div');
            modal.id = 'photo-modal';
            modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:2000;display:flex;align-items:center;justify-content:center;padding:24px;';
            modal.innerHTML = `
                <div style="max-width:600px;width:100%;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--border);">
                    <img src="${url}" alt="Delivery photo" style="width:100%;max-height:70vh;object-fit:contain;display:block;background:#000;">
                    <div style="padding:14px 18px;display:flex;justify-content:space-between;align-items:center;">
                        <div>
                            <div style="font-weight:600;font-size:0.9rem;">${label}</div>
                            <div style="font-size:0.75rem;color:var(--muted);margin-top:2px;">${new Date(uploadedAt).toLocaleString()}</div>
                        </div>
                        <div style="display:flex;gap:8px;">
                            <a href="${url}" download target="_blank" class="btn btn-outline btn-sm" style="font-size:0.75rem;">⬇ Download</a>
                            <button onclick="document.getElementById('photo-modal').remove()" class="btn btn-outline btn-sm" style="font-size:0.75rem;">✕ Close</button>
                        </div>
                    </div>
                </div>`;
            modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
            document.body.appendChild(modal);
        }

        // ── Proof Request ──────────────────────────────────────────
        async function doRequestProof(shipmentId) {
            const btn = document.getElementById('proof-request-btn');
            const statusEl = document.getElementById('proof-request-status');
            btn.disabled = true;
            btn.textContent = 'Sending...';
            try {
                await requestProofPhoto(shipmentId);
                statusEl.innerHTML = `<div style="padding:8px 12px;background:rgba(245,158,11,0.12);border-radius:6px;
                    font-size:0.8rem;color:#f59e0b;font-family:var(--font-mono);">
                    🔔 Proof request sent — waiting for driver to upload photo...
                </div>`;
                btn.textContent = '⏳ Pending...';
                // Poll for fulfillment
                pollProofFulfillment(shipmentId);
            } catch (err) {
                statusEl.innerHTML = `<div class="alert alert-error" style="font-size:0.8rem;">${err.message}</div>`;
                btn.disabled = false;
                btn.textContent = '🔔 Request Proof Photo';
            }
        }

        let proofFulfillInterval = null;
        function pollProofFulfillment(shipmentId) {
            if (proofFulfillInterval) clearInterval(proofFulfillInterval);
            proofFulfillInterval = setInterval(async () => {
                try {
                    const requests = await getProofRequests(shipmentId);
                    const latest   = requests[0];
                    if (latest && latest.status === 'fulfilled' && latest.image_url) {
                        clearInterval(proofFulfillInterval);
                        const statusEl = document.getElementById('proof-request-status');
                        const btn      = document.getElementById('proof-request-btn');
                        if (statusEl) statusEl.innerHTML = `
                            <div style="padding:8px 12px;background:rgba(34,197,94,0.1);border-radius:6px;
                                font-size:0.8rem;color:var(--green);font-family:var(--font-mono);">
                                ✅ Driver sent proof photo!
                            </div>`;
                        if (btn) { btn.disabled = false; btn.textContent = '🔔 Request Proof Photo'; }
                        // Refresh photo gallery
                        loadPodPhotos(shipmentId);
                    }
                } catch (e) { /* silent */ }
            }, 8000);
        }
    </script>
</body>

</html>
