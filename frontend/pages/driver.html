<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreightBid — Driver Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .load-card { cursor:pointer; transition:border-color 0.2s; }
        .load-card:hover { border-color:var(--accent); }
        .load-card.selected { border-color:var(--accent); background:var(--surface2); }
        .bid-input-row { display:flex; gap:10px; align-items:flex-end; }
        .bid-input-row input { flex:1; }
        .my-trip-card { border-left:3px solid var(--accent); }
        .trip-status-btns { display:flex; gap:10px; margin-top:12px; }
        .already-bid-badge { font-size:0.72rem; font-family:var(--font-mono); color:var(--blue); background:rgba(59,130,246,0.12); padding:2px 8px; border-radius:4px; }
    </style>
</head>
<body>

    <nav class="nav">
        <a class="nav-logo" href="/">Freight<span>Bid</span></a>
        <div class="nav-right">
            <span class="nav-user" id="nav-name">...</span>
            <span style="color:var(--border)">|</span>
            <span style="color:var(--blue);font-size:0.75rem;font-family:var(--font-mono)">DRIVER</span>
            <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">

        <!-- Stats Row -->
        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-number" id="stat-open">—</div>
                <div class="stat-label">Open Loads</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="stat-mybids">—</div>
                <div class="stat-label">My Bids</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="stat-active">—</div>
                <div class="stat-label">Active Trips</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="stat-done">—</div>
                <div class="stat-label">Completed</div>
            </div>
        </div>

        <div class="grid-2" style="gap:24px;align-items:start">

            <!-- LEFT -->
            <div>
                <!-- My Rating -->
                <div class="card" style="margin-bottom:0;">
                    <div class="card-header">
                        <div class="card-title">⭐ My Rating</div>
                    </div>
                    <div id="my-rating-box"><div class="loading">Loading...</div></div>
                </div>

                <!-- Available Loads -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Available Loads</div>
                        <button class="refresh-btn" onclick="loadOpenLoads()">↻ Refresh</button>
                    </div>
                    <div id="open-loads-list"><div class="loading">Loading...</div></div>
                </div>
            </div>

            <!-- RIGHT -->
            <div>
                <!-- Bid Placeholder -->
                <div class="card" id="bid-placeholder">
                    <div class="empty-state">
                        <div class="icon">🚛</div>
                        <p>Click a load on the left to place your bid.</p>
                    </div>
                </div>

                <!-- Bid Detail Panel -->
                <div class="card" id="bid-panel" style="display:none">
                    <div class="card-header">
                        <div class="card-title" id="bid-panel-title">Load Detail</div>
                        <div id="bid-panel-status"></div>
                    </div>
                    <div id="bid-panel-route" style="margin-bottom:12px"></div>
                    <div id="bid-panel-meta" class="meta-row" style="margin-bottom:16px"></div>
                    <hr class="divider">
                    <div id="bid-panel-myBid" style="margin-bottom:12px"></div>
                    <div id="bid-form">
                        <div class="form-group" style="margin-bottom:0">
                            <label>Your Bid Amount (₹)</label>
                            <div class="bid-input-row">
                                <input type="number" id="bid-amount" placeholder="e.g. 12000" min="1">
                                <button class="btn btn-primary" onclick="doPlaceBid()" id="bid-btn">Place Bid</button>
                            </div>
                        </div>
                        <p style="font-size:0.75rem;color:var(--muted);margin-top:8px">
                            Lowest bid wins. You can update your bid at any time.
                        </p>
                    </div>
                    <div id="bid-alert" style="margin-top:12px"></div>
                </div>

                <!-- My Active Bids -->
                <div class="card" style="margin-top:0">
                    <div class="card-header">
                        <div class="card-title">💰 My Active Bids</div>
                        <button class="refresh-btn" onclick="loadMyActiveBids()">↻ Refresh</button>
                    </div>
                    <div id="my-bids-list"><div class="loading">Loading...</div></div>
                </div>

                <!-- My Trips -->
                <div class="card" style="margin-top:0">
                    <div class="card-header">
                        <div class="card-title">My Trips</div>
                        <button class="refresh-btn" onclick="loadMyTrips()">↻ Refresh</button>
                    </div>
                    <div id="trip-map" style="height:250px;width:100%;border-radius:8px;margin-bottom:12px;display:none;border:1px solid var(--border);"></div>
                    <div id="my-trips-list"><div class="loading">Loading...</div></div>
                </div>
            </div>

        </div>
    </div>

    <script src="/js/api.js?v=2"></script>
    <script src="/js/driver.js?v=2"></script>
</body>
</html>
