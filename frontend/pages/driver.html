<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreightBid — Driver Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .load-card {
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .load-card:hover {
            border-color: var(--accent);
        }

        .load-card.selected {
            border-color: var(--accent);
            background: var(--surface2);
        }

        .bid-input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .bid-input-row input {
            flex: 1;
        }

        .my-trip-card {
            border-left: 3px solid var(--accent);
        }

        .trip-status-btns {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .refresh-btn {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--muted);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
        }

        .refresh-btn:hover {
            color: var(--accent);
        }

        .already-bid-badge {
            font-size: 0.72rem;
            font-family: var(--font-mono);
            color: var(--blue);
            background: rgba(59, 130, 246, 0.12);
            padding: 2px 8px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <nav class="nav">
        <a class="nav-logo" href="/">Freight<span>Bid</span></a>
        <div class="nav-right">
            <span class="nav-user" id="nav-name">...</span>
            <span style="color:var(--border)">|</span>
            <span style="color:var(--blue);font-size:0.75rem;font-family:var(--font-mono)">DRIVER</span>
            <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">

        <!-- Stats Row -->
        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-number" id="stat-open">—</div>
                <div class="stat-label">Open Loads</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="stat-mybids">—</div>
                <div class="stat-label">My Bids</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="stat-active">—</div>
                <div class="stat-label">Active Trips</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="stat-done">—</div>
                <div class="stat-label">Completed</div>
            </div>
        </div>

        <div class="grid-2" style="gap:24px;align-items:start">

            <!-- LEFT: Open loads to bid on -->
            <div>
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Available Loads</div>
                        <button class="refresh-btn" onclick="loadOpenLoads()">↻ Refresh</button>
                    </div>
                    <div id="open-loads-list">
                        <div class="loading">Loading...</div>
                    </div>
                </div>
            </div>

            <!-- RIGHT: Bid panel + My Trips -->
            <div>
                <!-- Bid Detail Panel -->
                <div class="card" id="bid-placeholder">
                    <div class="empty-state">
                        <div class="icon">🚛</div>
                        <p>Click a load on the left to place your bid.</p>
                    </div>
                </div>

                <div class="card" id="bid-panel" style="display:none">
                    <div class="card-header">
                        <div class="card-title" id="bid-panel-title">Load Detail</div>
                        <div id="bid-panel-status"></div>
                    </div>
                    <div id="bid-panel-route" style="margin-bottom:12px"></div>
                    <div id="bid-panel-meta" class="meta-row" style="margin-bottom:16px"></div>
                    <hr class="divider">
                    <div id="bid-panel-myBid" style="margin-bottom:12px"></div>
                    <div id="bid-form">
                        <div class="form-group" style="margin-bottom:0">
                            <label>Your Bid Amount (₹)</label>
                            <div class="bid-input-row">
                                <input type="number" id="bid-amount" placeholder="e.g. 12000" min="1">
                                <button class="btn btn-primary" onclick="doPlaceBid()" id="bid-btn">Place Bid</button>
                            </div>
                        </div>
                        <p style="font-size:0.75rem;color:var(--muted);margin-top:8px">
                            Lowest bid wins. You can update your bid at any time.
                        </p>
                    </div>
                    <div id="bid-alert" style="margin-top:12px"></div>
                </div>

                <!-- My Trips -->
                <div class="card" style="margin-top:0">
                    <div class="card-header">
                        <div class="card-title">My Trips</div>
                        <button class="refresh-btn" onclick="loadMyTrips()">↻ Refresh</button>
                    </div>
                    <div id="my-trips-list">
                        <div class="loading">Loading...</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        if (!isLoggedIn() || getRole() !== "driver") {
            window.location.href = "/";
        }

        document.getElementById("nav-name").textContent = getName();

        let selectedLoad = null;
        let openLoads = [];
        let myBidsMap = {};   // shipment_id → bid amount (my bids on open loads)

        // ── Open Loads ─────────────────────────────────────────────
        async function loadOpenLoads() {
            const container = document.getElementById("open-loads-list");
            try {
                openLoads = await getOpenShipments();
                document.getElementById("stat-open").textContent = openLoads.length;

                if (!openLoads.length) {
                    container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>No open loads right now. Check back soon.</p></div>`;
                    return;
                }

                container.innerHTML = openLoads.map(s => `
                <div class="load-card card" style="margin-bottom:10px;padding:16px"
                     id="lcard-${s.id}" onclick="selectLoad('${s.id}')">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                        <div style="font-weight:700;font-size:0.95rem">${s.pickup_address} → ${s.drop_address}</div>
                        ${myBidsMap[s.id] ? `<span class="already-bid-badge">Bid: ${fmt(myBidsMap[s.id])}</span>` : ""}
                    </div>
                    <div class="meta-row" style="gap:16px">
                        <div class="meta-item">
                            <span class="meta-label">Goods</span>
                            <span class="meta-value" style="font-size:0.85rem">${s.goods_desc}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Weight</span>
                            <span class="meta-value">${s.weight_kg} kg</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Vehicle</span>
                            <span class="meta-value">${s.vehicle_type}</span>
                        </div>
                        ${s.est_time_hours ? `
                        <div class="meta-item">
                            <span class="meta-label">Est. Time</span>
                            <span class="meta-value">${s.est_time_hours}h</span>
                        </div>` : ""}
                        ${s.bid_count > 0 ? `
                        <div class="meta-item">
                            <span class="meta-label">Bids</span>
                            <span class="meta-value accent">${s.bid_count}</span>
                        </div>` : ""}
                    </div>
                    ${s.deadline ? `<div style="font-size:0.75rem;color:var(--muted);margin-top:6px;font-family:var(--font-mono)">
                        Deadline: ${new Date(s.deadline).toLocaleString()}
                    </div>` : ""}
                </div>
            `).join("");

            } catch (err) {
                container.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
            }
        }

        // ── Select Load → Show Bid Panel ───────────────────────────
        async function selectLoad(id) {
            document.querySelectorAll(".load-card").forEach(c => c.classList.remove("selected"));
            document.getElementById(`lcard-${id}`)?.classList.add("selected");

            selectedLoad = openLoads.find(x => x.id === id);
            if (!selectedLoad) return;

            document.getElementById("bid-placeholder").style.display = "none";
            document.getElementById("bid-panel").style.display = "block";
            document.getElementById("bid-alert").innerHTML = "";

            document.getElementById("bid-panel-title").textContent = selectedLoad.goods_desc;
            document.getElementById("bid-panel-status").innerHTML = statusBadge(selectedLoad.status);
            document.getElementById("bid-panel-route").innerHTML =
                `<div class="route-display">
                <span class="route-from">${selectedLoad.pickup_address}</span>
                <span class="route-arrow">→</span>
                <span class="route-to">${selectedLoad.drop_address}</span>
            </div>`;
            document.getElementById("bid-panel-meta").innerHTML =
                `<div class="meta-item"><span class="meta-label">Weight</span><span class="meta-value">${selectedLoad.weight_kg} kg</span></div>
             <div class="meta-item"><span class="meta-label">Vehicle</span><span class="meta-value">${selectedLoad.vehicle_type}</span></div>
             ${selectedLoad.est_time_hours ? `<div class="meta-item"><span class="meta-label">Est. Time</span><span class="meta-value">${selectedLoad.est_time_hours} hours</span></div>` : ""}
             ${selectedLoad.bid_count > 0 ? `<div class="meta-item"><span class="meta-label">Bids So Far</span><span class="meta-value accent">${selectedLoad.bid_count}</span></div>` : ""}
             <div class="meta-item"><span class="meta-label">Posted</span><span class="meta-value" style="font-size:0.85rem">${timeAgo(selectedLoad.created_at)}</span></div>`;

            // Check if driver already bid
            const myBid = myBidsMap[id];
            if (myBid) {
                document.getElementById("bid-panel-myBid").innerHTML =
                    `<div class="alert alert-success">✓ You bid ${fmt(myBid)} — you can lower it below.</div>`;
                document.getElementById("bid-amount").value = myBid;
                document.getElementById("bid-btn").textContent = "Update Bid";
            } else {
                document.getElementById("bid-panel-myBid").innerHTML = "";
                document.getElementById("bid-amount").value = "";
                document.getElementById("bid-btn").textContent = "Place Bid";
            }
        }

        // ── Place / Update Bid ─────────────────────────────────────
        async function doPlaceBid() {
            const alertEl = document.getElementById("bid-alert");
            const btn = document.getElementById("bid-btn");
            const amount = document.getElementById("bid-amount").value;

            if (!selectedLoad) return;
            if (!amount || Number(amount) <= 0) {
                alertEl.innerHTML = `<div class="alert alert-error">Enter a valid bid amount.</div>`;
                return;
            }

            btn.disabled = true;
            btn.textContent = "Submitting...";

            try {
                const result = await placeBid(selectedLoad.id, Number(amount));
                myBidsMap[selectedLoad.id] = Number(amount);
                alertEl.innerHTML = `<div class="alert alert-success">✓ ${result.message}</div>`;
                document.getElementById("bid-btn").textContent = "Update Bid";
                document.getElementById("bid-panel-myBid").innerHTML =
                    `<div class="alert alert-success">✓ You bid ${fmt(amount)} — you can lower it below.</div>`;
                loadOpenLoads();   // refresh card badges
            } catch (err) {
                alertEl.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
            } finally {
                btn.disabled = false;
            }
        }

        // ── My Trips ───────────────────────────────────────────────
        async function loadMyTrips() {
            const container = document.getElementById("my-trips-list");
            try {
                const trips = await getMyShipments();
                const active = trips.filter(t => ["assigned", "in_transit"].includes(t.status)).length;
                const completed = trips.filter(t => t.status === "delivered").length;
                const myBids = trips.reduce((n, t) => n + (t.bids || []).length, 0);

                document.getElementById("stat-mybids").textContent = myBids;
                document.getElementById("stat-active").textContent = active;
                document.getElementById("stat-done").textContent = completed;

                if (!trips.length) {
                    container.innerHTML = `<div class="empty-state"><div class="icon">🏁</div><p>No assigned trips yet. Win a bid to get started.</p></div>`;
                    return;
                }

                container.innerHTML = trips.map(t => `
                <div class="card my-trip-card fade-in" style="margin-bottom:12px;padding:16px">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                        <div style="font-weight:700">${t.pickup_address} → ${t.drop_address}</div>
                        ${statusBadge(t.status)}
                    </div>
                    <div class="meta-row" style="gap:16px;margin-bottom:0">
                        <div class="meta-item">
                            <span class="meta-label">Goods</span>
                            <span class="meta-value" style="font-size:0.85rem">${t.goods_desc}</span>
                        </div>
                        ${t.winning_bid_amount ? `
                        <div class="meta-item">
                            <span class="meta-label">Earned</span>
                            <span class="meta-value green">${fmt(t.winning_bid_amount)}</span>
                        </div>` : ""}
                        ${t.est_time_hours ? `
                        <div class="meta-item">
                            <span class="meta-label">Approx Time</span>
                            <span class="meta-value">${t.est_time_hours}h</span>
                        </div>` : ""}
                        ${t.status === 'delivered' && t.started_at && t.delivered_at ? `
                        <div class="meta-item">
                            <span class="meta-label">Time Taken</span>
                            <span class="meta-value green">${calculateTimeTaken(t.started_at, t.delivered_at)}</span>
                        </div>` : ""}
                    </div>
                    ${renderTripButtons(t)}
                </div>
            `).join("");

            } catch (err) {
                container.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
            }
        }

        function renderTripButtons(trip) {
            if (trip.status === "assigned") {
                return `<div class="trip-status-btns">
                <button class="btn btn-primary btn-sm" onclick="doUpdateStatus('${trip.id}','in_transit')">
                    🚚 Start Trip
                </button>
            </div>`;
            }
            if (trip.status === "in_transit") {
                return `<div class="trip-status-btns">
                <button class="btn btn-primary btn-sm" onclick="doUpdateStatus('${trip.id}','delivered')">
                    ✅ Mark Delivered
                </button>
            </div>`;
            }
            if (trip.status === "delivered") {
                return "";
            }
            return "";
        }

        async function doUpdateStatus(shipmentId, status) {
            const label = status === "in_transit" ? "start this trip" : "mark as delivered";
            if (!confirm(`Confirm: ${label}?`)) return;
            try {
                await updateShipmentStatus(shipmentId, status);
                await loadMyTrips();
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        // Init
        loadOpenLoads();
        loadMyTrips();
    </script>
</body>

</html>
